name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest 

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Docker Hub login
      - name: Docker Login
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # Build backend image
      - name: Build Backend Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/todo-backend ./backend

      # Build frontend image
      - name: Build Frontend Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/todo-frontend ./frontend

      # Push images
      - name: Push Backend Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/todo-backend

      - name: Push Frontend Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/todo-frontend

  deploy:
    runs-on: self-hosted   # Your EC2 runner
    needs: build           # Only run after build succeeds

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    # 🔥 CREATE .env FILE (VERY IMPORTANT)
    - name: Create .env file
      run: |
        echo "MONGO_URI=${{ secrets.MONGO_URI }}" > .env

    # Stop old containers safely
    - name: Stop old containers
      run: docker-compose down --remove-orphans || true

    # Pull latest images
    - name: Pull latest images
      run: |
        docker pull ${{ secrets.DOCKER_USERNAME }}/todo-backend
        docker pull ${{ secrets.DOCKER_USERNAME }}/todo-frontend

    # Start containers
    - name: Start containers
      run: docker-compose up -d

    # Cleanup
    - name: Cleanup dangling images
      run: docker image prune -f