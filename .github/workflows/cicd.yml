name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: self-hosted   # your EC2 runner

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # 🐳 Login to Docker Hub
      - name: Docker Login
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # 🔨 Build Backend Image
      - name: Build Backend Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/todo-backend ./backend

      # 🔨 Build Frontend Image
      - name: Build Frontend Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/todo-frontend ./frontend

      # 🚀 Push Backend Image
      - name: Push Backend Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/todo-backend

      # 🚀 Push Frontend Image
      - name: Push Frontend Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/todo-frontend

      # 🛑 Stop old containers
      - name: Stop old containers
        run: docker-compose down || true

      # 📥 Pull latest images
      - name: Pull latest images
        run: docker-compose pull

      # ▶️ Start containers
      - name: Start containers
        run: docker-compose up -d

      # 🧹 Cleanup
      - name: Cleanup
        run: docker system prune -f