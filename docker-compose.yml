services:
  backend:
    image: tausifansar/todo-backend:latest
    ports:
      - "5000:5000"
    environment:
      - MONGODB_PASSWORD=${MONGODB_PASSWORD}
    depends_on:
      - mongo

  frontend:
    image: tausifansar/todo-frontend:latest
    ports:
      - "5173:80"
    depends_on:
      - backend

  mongo:
    image: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data: